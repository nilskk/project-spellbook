<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <h1 class="popup-title">Project Spellbook</h1>
    <div class="crit-section">
      <div class="crit-label">Crit Handling</div>
      <div class="crit-options">
        <button class="crit-btn" data-mode="normal">Normal</button>
        <button class="crit-btn" data-mode="disabled">Disable</button>
        <button class="crit-btn" data-mode="perfect">Perfect</button>
      </div>
      <div class="crit-desc" id="crit-desc">Dice double on nat 20 (default)</div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
